[project]
name = "proskenion"
version = "0.1.7"
description = "Auditorium AV control appliance — lighting (KNX, DMX), mixer, projector, HDMI matrix"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simon Wright" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "aiosqlite>=0.20",
  "pyserial-asyncio>=0.6",
  "bcrypt>=4.2",
  "pyjwt>=2.9",
  "cryptography>=43",
  "pydantic>=2.9",
  # FastAPI's documented dependency for Form/UploadFile parsing (§7.1 bulk
  # import, and Phase 6's larger uploads — see proskenion/api/knx.py).
  "python-multipart>=0.0.9",
  # §11.4 email alerts and Admin -> System -> Email (proskenion/core/email.py).
  "aiosmtplib>=3.0",
  # Cloudflare's DNS API (Q7, proskenion/core/cloudflare.py) — a synchronous
  # client, run from the same worker thread as the ACME calls below.
  "httpx>=0.28.1",
  # Certbot's own ACME client, issuing in-process rather than shelling out to
  # certbot so §21.24's six progress steps can be reported live (Q7).
  "acme>=5.8.0",
  "josepy>=2.2.0",
  # §13.3 backup destinations, in userland with no root mount (Q19,
  # proskenion/core/backup_destinations.py): SFTP and SMB respectively.
  "asyncssh>=2.24.0",
  "smbprotocol>=1.17.0",
  # Backup archives are .tar.zst (contracts §8). Python 3.13 ships no zstd
  # module (that lands in 3.14) and shelling out to the system `zstd` binary
  # would make the archive engine untestable on a machine without it
  # installed (it is not on this checkout's Windows path) — Q19 did not name
  # a compression library, so this fills that gap with a cross-platform wheel.
  "zstandard>=0.22.0",
]

[project.scripts]
proskenion = "proskenion.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  # Windows has no system tz database; on Debian zoneinfo uses the OS copy (§4.9)
  "tzdata>=2024.1; sys_platform == 'win32'",
  # A real (if minimal) SMTP server for the email tests (proskenion/core/email.py) —
  # STARTTLS, AUTH and recipient refusal, without a network relay.
  "aiosmtpd>=1.4",
  # The recovery web interface's own framework (Q19: "Flask, on the recovery
  # image only") — a dev dependency so appliance/recovery/webapp/app.py can be
  # tested off-device; appliance/recovery/build.sh installs it into the
  # recovery image's own venv, never into the main application's.
  "flask>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proskenion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
markers = [
  "hil: hardware-in-the-loop; skipped unless --run-hil is given (spec §22.6)",
  "integration: needs Docker (Pebble, a Cloudflare stub, Samba, an SFTP server); skips itself when docker is absent",
  "perf: exercises tools/perf's scenarios over a real uvicorn.Server and real WebSocket connections against the device stubs (P7-T8); slower than the rest of the suite, skipped unless --run-perf is given",
]
addopts = "-q"

[tool.ruff]
exclude = ["docs", "tools"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Spec §5.5 fixes the transport signature as receive(timeout: float); the
# framing helpers mirror it. ASYNC109 prefers asyncio.timeout, which the spec wins over.
"proskenion/core/transport/*.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["proskenion"]

[[tool.mypy.overrides]]
# pyserial and pyserial-asyncio ship no type information.
module = ["serial", "serial.*", "serial_asyncio"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# smbprotocol/smbclient (the SMB backup destination, proskenion/core/backup_destinations.py)
# ship no type information either.
module = ["smbclient", "smbclient.*", "smbprotocol", "smbprotocol.*"]
ignore_missing_imports = true
