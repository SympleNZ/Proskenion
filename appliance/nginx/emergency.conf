# /etc/nginx/sites-available/emergency.conf — emergency mode (§4.6, §16.7).
#
# Enabled by auditorium-emergency.service in place of auditorium.conf when
# /data is unavailable, an update could not recover, or /data is full (Q12).
# Everything it needs is on the read-only root or /srv/appliance: the
# responder (appliance/lib/auditorium_emergency.py), and the self-signed
# certificate generated at first boot. Nothing under /data or /opt/auditorium
# is referenced.
#
# Both /health and everything else are proxied to the responder, which
# listens on 127.0.0.1 only — the same shape as auditorium.conf's own
# proxy_pass to the application, so the responder can compute the §16.7
# payload and render the page with live values (hostname, time, SMART,
# last backup) rather than nginx serving a fixed string. It is started
# by systemd, ordered Before=nginx.service, so it is normally already
# listening by the time nginx reaches this config — and unlike the
# application, it needs no upstream health check: a request that arrives
# before it is listening gets nginx's ordinary 502 for one connection
# attempt, not a wrong answer.

server {
    listen 80;
    server_name av.school.nz;

    location /health {
        proxy_pass http://127.0.0.1:8090/health;
    }
    location / {
        proxy_pass http://127.0.0.1:8090/;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name av.school.nz;

    ssl_certificate     /srv/appliance/certs/self-signed/fullchain.pem;
    ssl_certificate_key /srv/appliance/certs/self-signed/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include snippets/auditorium-security-headers.conf;

    location /health {
        proxy_pass http://127.0.0.1:8090/health;
    }
    location / {
        proxy_pass http://127.0.0.1:8090/;
    }
}
