# /etc/nginx/snippets/auditorium-security-headers.conf — the four response
# headers of §4.13, shared by auditorium.conf and emergency.conf.
#
# nginx note: add_header is not inherited into a location that sets its own
# add_header (the /assets/ Cache-Control block in auditorium.conf), so static
# assets carry only their cache header. That is how §4.13 is written.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "same-origin" always;
