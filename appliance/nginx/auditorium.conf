# /etc/nginx/sites-available/auditorium.conf — exactly §4.13.
#
# Four details are load-bearing and easy to lose:
#   - X-Forwarded-For and X-Real-IP on every proxied location. Without them
#     FastAPI sees 127.0.0.1 for every request and per-IP rate limiting, the
#     audit log's ip_address and the failed-attempt threshold all break.
#     uvicorn runs with --proxy-headers --forwarded-allow-ips=127.0.0.1.
#   - client_max_body_size 256M: the default 1 MB rejects firmware packages
#     and the 5 MB KNX import.
#   - proxy_read_timeout 3600s on /ws: the default 60 s closes idle WebSockets.
#   - Static assets from disk, so the app shell loads while the service restarts.
#
# FastAPI listens on 127.0.0.1:8000 only and is never directly exposed.
# build.sh replaces av.school.nz with --fqdn. Fonts are self-hosted from
# /opt/auditorium/web/fonts/ — nothing here references an external host.

# HTTP — health endpoint, the §10.8 reconnection page, everything else redirects.
#
# /reconnect is served from the root image, not proxied to the application:
# it exists precisely because the application may be restarting when a
# network change is applied (§10.8, contracts §5). /health carries CORS
# because the reconnection page polls it cross-origin from the *old*
# address after a change — the one cross-origin request this appliance
# allows, and only here, never on 443's /health.
server {
    listen 80;
    server_name av.school.nz;

    location /health {
        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://127.0.0.1:8000/health;
    }
    location = /reconnect {
        add_header Cache-Control "no-store" always;
        alias /usr/local/share/auditorium/reconnect/index.html;
    }
    location /       { return 301 https://$host$request_uri; }
}

# HTTPS — main application
server {
    listen 443 ssl;
    http2 on;
    server_name av.school.nz;

    ssl_certificate     /data/certs/live/av.school.nz/fullchain.pem;
    ssl_certificate_key /data/certs/live/av.school.nz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The four headers §4.13 lists, shared with emergency.conf
    include snippets/auditorium-security-headers.conf;

    client_max_body_size 256M;      # firmware packages, KNX imports, backup restores

    root /opt/auditorium/web;

    # Static assets served directly — the shell still loads while the app restarts
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control immutable;
    }

    location /api/ {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # An application or OS package runs to gigabytes, and this machine has
    # 4 GB of RAM. Buffering the body — nginx's default — would spool it to
    # disk or memory here before the application saw a byte of it, so this
    # location turns buffering off and the body goes straight through to a
    # handler that streams it to /data/tmp and hashes it on the way. The
    # 256 MB above still applies to every other upload. The long timeouts are
    # for the apply itself, which builds a Python environment and tests the
    # migrations before it answers.
    location /api/v1/system/update {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size      2G;
        proxy_request_buffering   off;
        proxy_read_timeout        1800s;
        proxy_send_timeout        1800s;
    }

    # A backup archive carries the database, the certificates and the
    # baselines, and the same arithmetic applies as above: Q9 says every
    # upload streams to /data/tmp and never to RAM, so buffering is off here
    # too and the handler hashes the body as it writes it. The long timeouts
    # cover the checks — the manifest, the integrity check and a dry run of
    # the migrations on a copy — which all happen before it answers.
    location /api/v1/system/backup/restore {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size      2G;
        proxy_request_buffering   off;
        proxy_read_timeout        1800s;
        proxy_send_timeout        1800s;
    }

    location /ws {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health { proxy_pass http://127.0.0.1:8000/health; }

    # The app shell and everything else not under /assets/ -- index.html,
    # the manifests, the icons, the fonts -- is unhashed, so it must be
    # revalidated on every load rather than trusted from cache: without this
    # a plain reload after an update can keep running the old JS with no
    # prompt (seen on the CM5, 25 Sep, the Backup page). "no-cache" does not
    # mean "don't cache" -- it means the browser may keep a copy but must
    # send a conditional GET first, which nginx answers 304 when nothing
    # changed, so this costs one small round trip on a LAN, not a re-download.
    # `include` is repeated here rather than relied on from the server block
    # because a location that sets its own add_header stops inheriting the
    # server's (see the note atop auditorium-security-headers.conf) -- without
    # it this location would silently lose HSTS and the rest.
    location / {
        include snippets/auditorium-security-headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
