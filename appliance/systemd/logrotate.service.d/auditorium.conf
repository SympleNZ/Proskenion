# logrotate.service drop-in (§4.10). The state file normally lives in
# /var/lib/logrotate, which is on the read-only root's RAM overlay and would
# forget every rotation at reboot. Keep it with the logs on /data.

[Unit]
RequiresMountsFor=/data

[Service]
ExecStart=
ExecStart=/usr/sbin/logrotate --state /data/logs/.logrotate.state /etc/logrotate.conf
