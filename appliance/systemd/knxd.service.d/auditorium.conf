# knxd.service drop-in (§4.11). Debian's unit orders knxd after network.target
# only; the KNXnet/IP tunnel to the gateway needs an address, so wait for
# network-online.target. Ordering before core is done from core's side
# (After=knxd.service, Wants=knxd.service — Wants rather than Requires so a
# knxd that fails to start does not take core down with it).
#
# "If knxd fails to start within 30 seconds, the application starts anyway
# with the KNX domain marked unavailable" — that wait is in the application
# (§12.1 "Wait for the knxd socket, 30 s timeout"), not in systemd.
#
# /etc/knxd.conf is a symlink to /data/config/knxd.conf so the gateway address
# is editable without touching the read-only root (§4.3).
#
# network-online.target fires the instant eth0's carrier comes up — 35 ms on
# the CM5 commissioned 24-25 September 2026 — which is well before the switch
# port forwards or ARP has settled, so knxd's tunnel CONNECT got no answer and
# the unit failed its first start on every boot (Restart= ten seconds later
# always worked). ExecStartPre= now waits up to 30 s for the gateway's own
# KNXnet/IP port to answer before knxd tries it for real; it reads the
# gateway from KNXD_OPTS (After=auditorium-config-apply.service also means the
# knx_gateway firewall rule is already loaded for it) and always exits 0, so a
# gateway that is genuinely down still falls through to Restart=.
#
# The After=/Wants= on auditorium-config-apply.service was already here for
# /etc/knxd.conf's symlink target; it now also orders knxd after the firewall
# rule the wait script's own UDP/3671 exchange needs.

[Unit]
After=network-online.target auditorium-config-apply.service
Wants=network-online.target

[Service]
ExecStartPre=/usr/local/bin/auditorium-wait-for-knx-gateway
# Debian ships Restart=on-failure RestartSec=10; keep retrying forever — the
# gateway may simply be powered off. Lowered from 10s: the wait above should
# make a first-boot failure rare, but if the gateway is still not there a
# shorter retry recovers sooner without costing anything extra (knxd fails
# fast, not slowly, when the tunnel does not connect).
Restart=always
RestartSec=5
