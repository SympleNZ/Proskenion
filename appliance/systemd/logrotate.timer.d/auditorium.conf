# logrotate.timer drop-in (§4.10). Debian runs logrotate daily; "100 MB or
# daily, whichever comes first" needs the size check to run more often than
# once a day, so run hourly. The rotation rules themselves are in
# /etc/logrotate.d/auditorium.

[Timer]
OnCalendar=
OnCalendar=hourly
RandomizedDelaySec=5m
AccuracySec=1m
