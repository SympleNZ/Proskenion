# /etc/systemd/timesyncd.conf — time synchronisation (§4.9).
# build.sh --ntp replaces ntp.school.nz at image build time; the placeholder is
# deliberately a name that resolves nowhere, so an unrendered file fails loudly
# rather than quietly syncing to somebody else's clock.
#
# The school has no NTP server of its own, so the preferred server is the NZ
# pool (settled 2026-09-21) and the fallbacks are the generic pools — nz. is
# not repeated below, since a fallback identical to the preferred server buys
# nothing. The site survey confirmed the VLAN reaches UDP 123 outbound.
#
# What this costs: with the school's internet down the appliance has no time
# source at all, where a server on the VLAN would still have answered. The CM5's
# RTC keeps time across the gap, and the application runs in §4.9's degraded
# time mode rather than blocking, so this is a tolerable loss rather than a
# silent one. If the school ever stands up its own NTP server, --ntp is all it
# takes.

[Time]
NTP=ntp.school.nz
FallbackNTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org
