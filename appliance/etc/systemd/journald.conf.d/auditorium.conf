# /etc/systemd/journald.conf.d/auditorium.conf (§4.10, §4.3).
#
# Persistent, on /data — not in the RAM overlay.
#
# §4.10 says what the journal carries (service start and stop events; the
# application logs to files under /data/logs), not where it lives. This file
# used to say Storage=volatile, on the reasoning that the root is a RAM overlay
# so a persistent journal "would live in RAM anyway". That is true of
# /var/log on the overlay, and false of /data, which is a real writable
# partition.
#
# The difference was learned the hard way. The first boot of the golden image,
# 22 September 2026, failed in a way that also took the network down. With a
# volatile journal every reboot erased the one record of why, and there was no
# console login either, so the appliance's failure could not be investigated
# by any route. A boot that fails must leave its account behind.
#
# How it gets there: /etc/fstab bind-mounts /data/logs/journal onto
# /var/log/journal, with x-systemd.requires-mounts-for=/data. Being a real mount
# point, systemd-journal-flush.service (RequiresMountsFor=/var/log/journal)
# waits for it before moving the early-boot journal out of /run. If /data
# cannot be mounted, the bind fails too (nofail), nothing is flushed, and
# journald simply stays in /run as it always did — the fallback is the old
# behaviour, not a new failure.
#
# Bounded on both sides: /data is 64 GB and the journal carries service events
# only, so 256 MB is months of history; /run stays capped as before for the
# early boot and the /data-less case.

[Journal]
Storage=persistent
SystemMaxUse=256M
SystemMaxFileSize=32M
RuntimeMaxUse=64M
RuntimeMaxFileSize=8M
Compress=yes
