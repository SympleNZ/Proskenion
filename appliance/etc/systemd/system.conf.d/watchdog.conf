# /etc/systemd/system.conf.d/watchdog.conf — hardware watchdog (§4.7).
#
# systemd opens the device and pets it; if systemd itself hangs, the SoC
# resets the machine within about 15 s. Requires dtparam=watchdog=on in
# /boot/firmware/config.txt on the reference platform (§4.8). The application
# never touches /dev/watchdog; its own liveness is WatchdogSec= on
# auditorium-core.service.
#
# The device path below is the reference platform's. On a port the platform
# layer (§5.4) knows the right node; this file is the one place to change it.

[Manager]
RuntimeWatchdogSec=15
WatchdogDevice=/dev/watchdog
# Reboot cleanly rather than hang if shutdown itself stalls.
RebootWatchdogSec=10min
