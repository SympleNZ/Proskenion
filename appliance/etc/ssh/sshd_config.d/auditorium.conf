# /etc/ssh/sshd_config.d/auditorium.conf — SSH hardening (§6.15).
#
# Key-only. The source restriction (management address only, §3.3) is done by
# nftables, not here; this file controls what sshd itself accepts.
#
# Host keys and authorised keys live on /srv/appliance (partition 4) because
# the root is read-only: keys generated at first boot would otherwise
# evaporate at the next reboot. build.sh removes the stock host keys from the
# image; auditorium-first-boot generates these.
#
# sshd reads them through /etc/ssh/appliance, a bind mount of /srv/appliance/ssh
# (/etc/fstab), never through /srv/appliance directly. StrictModes refuses a key
# file if any directory above it is group-writable, and /srv/appliance is
# group-writable by design. Through the bind mount every directory above the
# keys is root's and locked, so StrictModes stays on and still does its job.
# Writers — first boot, the build — keep using /srv/appliance/ssh.

# No ListenAddress: sshd listens on every address, and nftables decides who may
# reach it (§3.3 — the management address only). This file used to pin sshd to
# the controller's address, filled in by build.sh from --address. That broke in
# two independent ways:
#
#   * At boot. ssh.service starts after network.target, which does not wait for
#     NetworkManager to assign addresses. If sshd starts before the address
#     exists, bind() fails with "Cannot assign requested address" and sshd exits
#     255 — which Debian's unit deliberately does not restart. SSH is then down
#     until someone restarts it by hand, and nobody can, because SSH is down.
#   * After an address change. Phase 6 made the address runtime configuration
#     (system.json, applied by auditorium-config-apply), but ListenAddress was
#     baked into the image at build time. Change the address from the admin
#     interface and sshd would still be pinned to the old one: SSH gone after
#     the next reboot, and not re-imageable from the interface either.
#
# Pinning the address was defence in depth on top of a firewall that already
# does the whole job. It is not worth a failure mode that locks out the only
# remote door.

HostKey /etc/ssh/appliance/host_keys/ssh_host_ed25519_key
HostKey /etc/ssh/appliance/host_keys/ssh_host_rsa_key

AuthorizedKeysFile /etc/ssh/appliance/authorized_keys/%u

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
UsePAM yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 60
ClientAliveCountMax 3
MaxAuthTries 3
LoginGraceTime 30
AllowUsers @ADMIN_USER@
